name: Publish release

on:
  push:
    tags:
      - v1.0

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-26.04
    env:
      SOURCE_DATE_EPOCH: "1793300904"
      PACKAGE: mainuan-flatpak-install-gui_1.0_all.deb
      PACKAGE_SHA256: 4b31d19c144a5f7cf9cbaca3b4eb1f4d37dc46488b953cb4e933d6526492d3fd
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify release package
        run: |
          ./build.sh dist
          test "$(dpkg-deb -f "dist/$PACKAGE" Version)" = 1.0
          echo "$PACKAGE_SHA256  dist/$PACKAGE" | sha256sum --check --strict
          printf '%s  %s\n' "$PACKAGE_SHA256" "$PACKAGE" > "dist/$PACKAGE.sha256"
      - name: Create final release with assets
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A release $GITHUB_REF_NAME já existe; não será sobrescrita." >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Mainuan Instalador Flatpak 1.0" \
            --notes-file docs/notas-lancamento-1.0.md \
            "dist/$PACKAGE" "dist/$PACKAGE.sha256"
